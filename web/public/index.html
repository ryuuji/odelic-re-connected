<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>ODELIC Re-Connected ウェブ管理画面</title>
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1f1c17" media="(prefers-color-scheme: dark)" />
        <link rel="stylesheet" href="/css/style.css" />
        <link rel="icon" href="/favicon.svg" />
        <link rel="apple-touch-icon" href="/favicon.svg" />
    </head>
    <body>
        <!--
            ⚠️ ヘッダーとタブは 1 つの sticky にまとめてある。
               別々に貼るとタブの top をヘッダーの実高さに合わせる必要があり、
               文字サイズが変わるだけで隙間や被りが出る。
        -->
        <div class="topbar">
            <header>
                <!-- 天井灯を真下から見た形。⭐ 外周が主灯、中心が常夜灯（favicon と同じ） -->
                <svg class="mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                    <circle cx="16" cy="16" r="14" fill="#f2b705" />
                    <circle cx="16" cy="16" r="9" fill="#fff3cc" />
                    <circle cx="16" cy="16" r="3.5" fill="#f2b705" />
                </svg>
                <!--
                    ⚠️ ログアウトはここに置かない。スマホの幅では
                       「ロゴ + 名前 + 接続状態 + ボタン」が並ばず、名前が折り返す。
                       めったに押さないので「設定」タブの一番下に移した。
                -->
                <h1><span class="app">ODELIC Re-Connected</span><span class="sub">ウェブ管理画面</span></h1>
                <span class="pill" id="conn">接続を確認中</span>
            </header>

            <nav id="tabs">
                <button data-tab="lights" aria-current="page">照明</button>
                <button data-tab="status">状態</button>
                <button data-tab="settings">設定</button>
                <button data-tab="matter">Matter</button>
                <button data-tab="logs">ログ</button>
            </nav>
        </div>

        <main>
            <section id="tab-lights"></section>
            <section id="tab-status" hidden></section>
            <section id="tab-settings" hidden></section>
            <section id="tab-matter" hidden></section>
            <section id="tab-logs" hidden></section>
        </main>

        <div id="toast" role="status" aria-live="polite" hidden></div>

        <script type="module" src="/js/app.js"></script>
    </body>
</html>
